name: TexasSandFest
options:
  bundleIdPrefix: com.portalcodex
  deploymentTarget:
    iOS: "18.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "3"
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: J2459M36QV
targets:
  TexasSandFest:
    type: application
    platform: iOS
    sources:
      - TexasSandFest
    resources:
      - TexasSandFest/Resources
    info:
      path: TexasSandFest/Info.plist
      properties:
        CFBundleDisplayName: Texas SandFest
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.portalcodex.texassandfest.public
            CFBundleURLSchemes:
              - sandfest
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: Scan your Eventeny ticket QR to add it to your SandFest wristbands.
    entitlements:
      path: TexasSandFest/TexasSandFest.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:www.heyelab.com
          - applinks:sandfest.heyelab.com
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.portalcodex.texassandfest
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
  TexasSandFestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TexasSandFestTests
    dependencies:
      - target: TexasSandFest
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.portalcodex.texassandfest.tests
      BUNDLE_LOADER: $(TEST_HOST)
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/TexasSandFest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TexasSandFest
  TexasSandFestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TexasSandFestUITests
    dependencies:
      - target: TexasSandFest
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.portalcodex.texassandfest.uitests
      TEST_TARGET_NAME: TexasSandFest
