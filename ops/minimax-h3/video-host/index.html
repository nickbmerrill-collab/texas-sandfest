<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texas SandFest Board Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #071619; color: #fffdf7; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { width: min(1440px, calc(100% - 40px)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    header { min-height: 86px; border-bottom: 1px solid rgba(244, 223, 172, .2); }
    .brand { font-family: Georgia, serif; font-size: 28px; }
    .label { color: #f4dfac; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    main { width: min(1440px, calc(100% - 40px)); margin: auto; padding: 28px 0; }
    video { display: block; width: 100%; max-height: calc(100vh - 190px); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 22px 80px rgba(0,0,0,.42); }
    footer { min-height: 76px; color: #b9c8c5; font-size: 14px; }
    a { color: #fffdf7; text-underline-offset: 4px; }
    @media (max-width: 680px) {
      header, footer { width: min(100% - 24px, 1440px); }
      main { width: 100%; padding: 12px 0; }
      header { min-height: 70px; }
      footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 5px; }
      .brand { font-size: 23px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Texas SandFest</div>
    <div class="label">Board Presentation Demo</div>
  </header>
  <main>
    <video controls playsinline preload="metadata" poster="texas-sandfest-world-class-board-demo-poster.jpg">
      <source src="texas-sandfest-world-class-board-demo.mp4" type="video/mp4">
      Your browser cannot play this video. Use the direct file link below.
    </video>
  </main>
  <footer>
    <span>Locally generated presentation film</span>
    <a href="texas-sandfest-world-class-board-demo.mp4" download>Download the MP4</a>
  </footer>
</body>
</html>
